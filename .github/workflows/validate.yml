name: Validate skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "tombstones.json"
      - "scripts/**"
      - "schemas/**"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "tombstones.json"
      - "scripts/**"
      - "schemas/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Front matter and safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate every playbook
        run: python3 scripts/validate.py
